[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edvi-worker"
version = "0.1.0"
description = "Cross-platform Edvi compute worker for macOS, Windows, and Linux"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Edvi"}]
dependencies = []

[project.optional-dependencies]
mlx = ["mlx-lm>=0.30,<1; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
edvi = "edvi_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edvi_worker = ["static/*.html", "static/*.js", "static/*.css"]
