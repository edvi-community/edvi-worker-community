name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install detect-secrets==1.5.0
      - run: python tools/scan_secrets.py
  contribution-checks:
    name: Contribution checks
    if: ${{ always() }}
    needs: [unit-tests, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful tests and secret scan
        if: ${{ needs.unit-tests.result != 'success' || needs.secrets.result != 'success' }}
        run: exit 1
